
name: Windows RDP VPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Write-Host "Enabling Remote Desktop..."

      - name: Create RDP User
        shell: pwsh
        run: |
          Write-Host "Creating RDP user..."

      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Installing Tailscale..."

      - name: Connect to Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              throw "Tailscale is not installed."
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $service = Get-Service -Name "Tailscale" -ErrorAction Stop

          if ($service.Status -ne "Running") {
              Start-Service -Name "Tailscale"
          }

          Start-Sleep -Seconds 5

          $authKey = $env:TAILSCALE_AUTH_KEY.Trim()

          & $tailscale up "--auth-key=$authKey" "--hostname=github-windows-rdp" "--unattended"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale authentication failed."
          }

          $ip = $null

          for ($i = 1; $i -le 30; $i++) {
              $result = & $tailscale ip -4

              if ($LASTEXITCODE -eq 0 -and $result) {
                  $ip = ($result | Select-Object -First 1).Trim()
                  if ($ip -match '^100\.') {
                      break
                  }
              }

              Start-Sleep -Seconds 2
          }

          if (-not $ip -or $ip -notmatch '^100\.') {
              throw "Could not obtain Tailscale IP."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $ip"
