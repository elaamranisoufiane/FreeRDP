
name: Windows RDP VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      # 1. Configure Windows Remote Desktop
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          # Disable existing broad RDP firewall rules
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          # Allow RDP only from the Tailscale IPv4 range
          Remove-NetFirewallRule -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          # Ensure the RDP service is running
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      # 2. Create the RDP administrator account
      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD) -or
              $env:RDP_PASSWORD.Length -lt 16) {
              throw "RDP_PASSWORD must contain at least 16 characters."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP"
          }

          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -Description "Temporary RDP administrator" `
            -AccountNeverExpires `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          Write-Host "RDP administrator created successfully."

      # 3. Install Tailscale
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
              throw "Tailscale installation failed."
          }

          Write-Host "Tailscale installed successfully."

      # 4. Connect to your Tailscale network
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY is missing."
          }

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to connect to Tailscale."
          }

          # Retrieve the assigned IPv4 address
          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {
              $tsIP = (& $tailscale ip -4 | Select-Object -First 1).Trim()

              if ($tsIP -match '^100\.') {
                  break
              }

              Start-Sleep -Seconds 5
          }

          if ($tsIP -notmatch '^100\.') {
              throw "Tailscale IP assignment failed."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected successfully."

      # 5. Verify RDP service
      - name: Verify RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking RDP service..."

          $service = Get-Service TermService

          if ($service.Status -ne "Running") {
              throw "Remote Desktop service is not running."
          }

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (!$test.TcpTestSucceeded) {
              throw "RDP port 3389 is not responding."
          }

          Write-Host "RDP service is ready."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

      # 6. Maintain the RDP session
      - name: Keep Windows VPS Running
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "       WINDOWS RDP VPS READY"
          Write-Host "======================================"
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Your RDP_PASSWORD secret"
          Write-Host "Port:     3389"
          Write-Host "======================================"

          while ($true) {
              Write-Host "[$(Get-Date)] Windows VPS is running..."
              Start-Sleep -Seconds 300
          }
