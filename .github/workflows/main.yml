name: Windows RDP over Tailscale

on:
  workflow_dispatch:
    inputs:
      client_tailscale_ip:
        description: "Tailscale IP of your client device (optional, for a connectivity test)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-rdp
  cancel-in-progress: true

jobs:
  windows-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      # 1. Validate secrets before doing anything else
      - name: Validate secrets
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $key = "$env:TAILSCALE_AUTH_KEY".Trim()
          if ([string]::IsNullOrWhiteSpace($key)) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }
          if ($key -notlike "tskey-auth-*") {
            throw "TAILSCALE_AUTH_KEY must be an auth key starting with 'tskey-auth-' (not tskey-api- or tskey-client-)."
          }

          $pw = "$env:RDP_PASSWORD"
          if ($pw.Length -lt 20) {
            throw "RDP_PASSWORD must be at least 20 characters."
          }
          if ($pw -cnotmatch '[A-Z]' -or
              $pw -cnotmatch '[a-z]' -or
              $pw -notmatch '[0-9]' -or
              $pw -notmatch '[^a-zA-Z0-9]') {
            throw "RDP_PASSWORD needs uppercase, lowercase, digits and symbols."
          }
          if ($pw -match 'RDP') {
            throw "RDP_PASSWORD must not contain the username 'RDP' (any case)."
          }

          Write-Host "Secrets look valid."

      # 2. Enable Remote Desktop and restrict the firewall to Tailscale
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          Set-Service -Name TermService -StartupType Automatic
          if ((Get-Service TermService).Status -ne "Running") {
            Start-Service TermService
          }

          # Disable built-in RDP rules so only Tailscale can reach port 3389
          Disable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any | Out-Null

          Write-Host "RDP and firewall configured."

      # 3. Create the RDP user
      - name: Create RDP user
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RDP"
          $securePassword = ConvertTo-SecureString -String $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $username
          }

          try {
            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -Description "Temporary RDP administrator" `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -ErrorAction Stop | Out-Null
          }
          catch {
            Write-Host "Account creation error: $($_.Exception.Message)"
            Write-Host "=== Windows password policy ==="
            net accounts
            throw "Windows rejected the RDP password."
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          Write-Host "RDP account created."

      # 4. Install Tailscale
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:TEMP "tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
            throw "Tailscale executable not found."
          }

          Write-Host "Tailscale installed."

      # 5. Connect to Tailscale
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $authKey   = "$env:TAILSCALE_AUTH_KEY".Trim()

          if ((Get-Service Tailscale).Status -ne "Running") {
            Start-Service Tailscale
          }
          Start-Sleep -Seconds 5

          & $tailscale up `
            "--auth-key=$authKey" `
            "--hostname=gh-rdp-$env:GITHUB_RUN_ID" `
            "--unattended" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed. Generate a new reusable + ephemeral auth key (tskey-auth-...) and update the secret."
          }

          $tsIP = $null
          for ($i = 1; $i -le 30; $i++) {
            $result = & $tailscale ip -4 2>$null
            if ($LASTEXITCODE -eq 0 -and $result) {
              $candidate = ($result | Select-Object -First 1).Trim()
              if ($candidate -match '^100\.') {
                $tsIP = $candidate
                break
              }
            }
            Write-Host "Waiting for Tailscale IP ($i/30)..."
            Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
            & $tailscale status
            throw "Could not obtain Tailscale IP."
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tailscale IP: $tsIP"

      # 6. Diagnostics (never fails the job)
      - name: Diagnose Tailscale
        shell: pwsh
        env:
          CLIENT_TAILSCALE_IP: ${{ inputs.client_tailscale_ip }}
        run: |
          $ErrorActionPreference = "Continue"
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale status
          & $tailscale netcheck

          if (-not [string]::IsNullOrWhiteSpace($env:CLIENT_TAILSCALE_IP)) {
            Write-Host "Pinging client $env:CLIENT_TAILSCALE_IP"
            & $tailscale ping -c 3 --until-direct=false --timeout=5s $env:CLIENT_TAILSCALE_IP
          }

          exit 0

      # 7. Verify RDP is listening
      - name: Verify RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ((Get-Service TermService).Status -ne "Running") {
            throw "Remote Desktop service is not running."
          }

          if (-not (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)) {
            throw "Nothing is listening on TCP port 3389."
          }

          $test = Test-NetConnection 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
          if (-not $test.TcpTestSucceeded) {
            throw "Local RDP port test failed."
          }

          Write-Host "RDP is ready on $env:TAILSCALE_IP"

      # 8. Keep the runner alive
      - name: Keep runner alive
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "         WINDOWS RDP READY"
          Write-Host "======================================"
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: .\RDP"
          Write-Host "Password: the RDP_PASSWORD secret"
          Write-Host "Port:     3389"
          Write-Host "======================================"

          while ($true) {
            Write-Host "[$(Get-Date -Format s)] running..."
            Start-Sleep -Seconds 300
          }

      # 9. Cleanup, even on cancel or failure
      - name: Tailscale logout
        if: always()
        shell: pwsh
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path $tailscale) { & $tailscale logout }
